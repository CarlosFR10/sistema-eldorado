x-backend-environment: &backend-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:-base64:Qm5OMzRrVGRwRkxkTjRudTdYV2J4eXZMRGN6YTZYSjA=}
  APP_URL: ${APP_URL:-http://localhost}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-eldorado}
  DB_USERNAME: ${DB_USERNAME:-eldorado}
  DB_PASSWORD: ${DB_PASSWORD:-eldorado2026}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-eldoradoRedis2026}
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  JWT_SECRET: ${JWT_SECRET:-eldorado-jwt-secret-dev-2026-minimum-256-bit-key-para-desarrollo}
  QR_SECRET: ${QR_SECRET:-supersecretoeldorado2026}
  BIOMETRIA_DRIVER: ${BIOMETRIA_DRIVER:-simulador}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-eldorado}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-eldorado-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-eldorado-secret}
  REVERB_HOST: ${REVERB_HOST:-0.0.0.0}
  REVERB_PORT: ${REVERB_PORT:-8080}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && cp -r dist/. /var/www/frontend"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/var/www/frontend
    networks:
      - eldorado_net

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/frontend:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eldorado_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    environment: *backend-environment
    depends_on:
      - mysql
      - redis
    networks:
      - eldorado_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-eldoradoRoot2026}
      MYSQL_DATABASE: ${DB_DATABASE:-eldorado}
      MYSQL_USER: ${DB_USERNAME:-eldorado}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eldorado2026}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eldorado_net

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-eldoradoRedis2026}
    volumes:
      - redis_data:/data
    networks:
      - eldorado_net

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  frontend_dist:

networks:
  eldorado_net:
    driver: bridge
