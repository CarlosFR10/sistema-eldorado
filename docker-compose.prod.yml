version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/backend
      - ./frontend/dist:/var/www/frontend
    depends_on:
      - php
    networks:
      - eldorado_net

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/backend
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - eldorado_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - eldorado_net

  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - eldorado_net

  reverb:
    command: php artisan reverb:start
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - eldorado_net

  scheduler:
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - eldorado_net

  queue:
    command: php artisan queue:work redis --sleep=3 --tries=3
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - eldorado_net

volumes:
  mysql_data:
  redis_data:

networks:
  eldorado_net:
    driver: bridge
